services:
  mysql:
    image: mysql:8.0
    container_name: swarm-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swarm_demo}
      MYSQL_USER: ${MYSQL_USER:-swarm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swarm}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: swarm-demo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./projects/backend
      dockerfile: Dockerfile
    container_name: swarm-demo-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-swarm_demo};Uid=${MYSQL_USER:-swarm};Pwd=${MYSQL_PASSWORD:-swarm};
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5010:8080"

  frontend:
    build:
      context: ./projects/frontend
      dockerfile: Dockerfile
    container_name: swarm-demo-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  mysql-data:
  redis-data:

name: Skills — Checker

on:
  pull_request:
    paths:
      - 'projects/**'
      - 'swarmagents.workspace.json'
      - 'skills/**'
      - '.claude/agents/**'
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  analyze:
    name: '🔍 Skill Checker'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4

      # ── Step 1: Detect all projects ──
      - name: '🔍 Step 1 — Detect project stacks'
        id: detect
        run: |
          echo "## 🔍 SwarmAgents Skill Analysis" > skill-report.md
          echo "" >> skill-report.md

          # Backend
          if [ -d "projects/backend" ]; then
            echo "### 🔧 Backend" >> skill-report.md
            echo "| Detection | Result |" >> skill-report.md
            echo "|-----------|--------|" >> skill-report.md
            echo "| Stack | .NET 8 / ASP.NET Core |" >> skill-report.md
            echo "| Required skill | \`dotnet-backend\` |" >> skill-report.md

            if [ -f "skills/dotnet/SKILL.md" ]; then
              echo "| Status | ✅ Installed |" >> skill-report.md
            else
              echo "| Status | ❌ Missing |" >> skill-report.md
              echo "| Install | \`git clone https://github.com/PoliedroSoftware/swarm-agents-skills.git skills\` |" >> skill-report.md
            fi
            echo "| Agents | 12 (planner, orchestrator, code-writer, test-writer, architect-reviewer, db-migrator, postman-curator, sonar-analyst, jmeter-runner, qa-tester, security-reviewer, final-reviewer) |" >> skill-report.md
            echo "" >> skill-report.md
          fi

          # Frontend
          if [ -d "projects/frontend" ] && [ -f "projects/frontend/angular.json" ]; then
            NG_VERSION=$(grep -oP '"@angular/core":\s*"\^\K[^"]+' projects/frontend/package.json 2>/dev/null || echo "detected")
            echo "### 🎨 Frontend" >> skill-report.md
            echo "| Detection | Result |" >> skill-report.md
            echo "|-----------|--------|" >> skill-report.md
            echo "| Stack | Angular $NG_VERSION |" >> skill-report.md
            echo "| Required skill | \`angular-frontend\` |" >> skill-report.md

            if [ -f "skills/angular/SKILL.md" ]; then
              echo "| Status | ✅ Installed |" >> skill-report.md
            else
              echo "| Status | ❌ Missing |" >> skill-report.md
              echo "| Install | \`git clone https://github.com/PoliedroSoftware/swarm-agents-skills.git skills\` |" >> skill-report.md
            fi
            echo "| Agents | 11 (planner, orchestrator, code-writer, test-writer, component-reviewer, a11y-auditor, perf-auditor, e2e-writer, qa-tester, security-reviewer, final-reviewer) |" >> skill-report.md
            echo "" >> skill-report.md
          fi

      # ── Step 2: Catalog available skills ──
      - name: '📚 Step 2 — Catalog available skill packs'
        run: |
          echo "### 📚 Available skill packs" >> skill-report.md
          echo "| Skill | Stack | Status | Agents |" >> skill-report.md
          echo "|-------|-------|--------|--------|" >> skill-report.md

          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}SKILL.md" ]; then
              echo "| $name | $name | ✅ Ready | See SKILL.md |" >> skill-report.md
            elif [ -f "${dir}PLACEHOLDER.md" ]; then
              echo "| $name | $name | 🔜 Coming soon | Planned |" >> skill-report.md
            fi
          done

          echo "" >> skill-report.md
          echo "---" >> skill-report.md
          echo "*🔍 Automated by SwarmAgents Skill Checker — [docs](https://poliedrosoftware.github.io/swarm-agents-skills/)*" >> skill-report.md

      # ── Step 3: Post to PR ──
      - name: '💬 Step 3 — Post skill report to PR'
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: skill-report.md
          comment-tag: swarm-skills
          mode: recreate

      - name: '📊 Summary'
        run: cat skill-report.md >> $GITHUB_STEP_SUMMARY

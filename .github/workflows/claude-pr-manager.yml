name: Claude Code — PR Manager

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]

jobs:
  # ═══════════════════════════════════════════════════════════════
  review:
    name: '🤖 PR Analysis'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 1: Detect changed files ──
      - name: '🔍 Step 1 — Detect changed files'
        run: |
          echo "## 🤖 SwarmAgents PR Analysis" > review.md
          echo "" >> review.md
          echo "### 📁 Files changed" >> review.md
          echo '```' >> review.md
          git diff --name-only origin/${{ github.base_ref }}...HEAD | head -30 >> review.md
          echo '```' >> review.md

      # ── Step 2: Classify changes ──
      - name: '🏷️ Step 2 — Classify changes'
        run: |
          echo "" >> review.md
          echo "### 🏷️ Classification" >> review.md
          echo "| Type | Detail |" >> review.md
          echo "|------|--------|" >> review.md

          # Backend
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "projects/backend/"; then
            COUNT=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "projects/backend/" | wc -l)
            echo "| 🔧 Backend | $COUNT files changed |" >> review.md
          fi

          # Frontend
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "projects/frontend/"; then
            COUNT=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "projects/frontend/" | wc -l)
            echo "| 🎨 Frontend | $COUNT files changed |" >> review.md
          fi

          # Contract
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "contracts/"; then
            echo "| 📄 Contract | ⚠️ api.openapi.yaml changed |" >> review.md
          fi

          # Agents
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "\.claude/agents/"; then
            echo "| 🤖 Agents | Agent definitions modified |" >> review.md
          fi

      # ── Step 3: Skill check ──
      - name: '🔍 Step 3 — Check required skill packs'
        run: |
          echo "" >> review.md
          echo "### 📚 Required skill packs" >> review.md
          echo "| Project | Stack | Skill | Status |" >> review.md
          echo "|---------|-------|-------|--------|" >> review.md

          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "projects/backend/"; then
            if [ -f "skills/dotnet/SKILL.md" ]; then
              echo "| Backend | .NET 8 | dotnet-backend | ✅ Installed |" >> review.md
            else
              echo "| Backend | .NET 8 | dotnet-backend | ❌ Missing |" >> review.md
            fi
          fi

          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "projects/frontend/"; then
            if [ -f "skills/angular/SKILL.md" ]; then
              echo "| Frontend | Angular 21 | angular-frontend | ✅ Installed |" >> review.md
            else
              echo "| Frontend | Angular 21 | angular-frontend | ❌ Missing |" >> review.md
            fi
          fi

      # ── Step 4: Suggested workflow ──
      - name: '💡 Step 4 — Suggested workflow'
        run: |
          echo "" >> review.md
          echo "### 💡 Suggested SwarmAgents workflow" >> review.md
          echo '```' >> review.md
          echo '/swarm-plan "Review PR #${{ github.event.number }} changes"'
          echo '/swarm-run'
          echo '```' >> review.md
          echo "" >> review.md
          echo "---" >> review.md
          echo "*🤖 Automated by SwarmAgents PR Manager — [docs](https://poliedrosoftware.github.io/swarm-agents-skills/)*" >> review.md

      # ── Step 5: Post review ──
      - name: '💬 Step 5 — Post review comment'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: review.md
          comment-tag: swarm-review
          mode: recreate

      - name: '🏷️ Add labels'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: auto-reviewed

  # ═══════════════════════════════════════════════════════════════
  triage:
    name: '🎫 Issue Triage'
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'

    permissions:
      issues: write

    steps:
      - name: '🎫 Triage new issue'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();

            let labels = ['triage'];

            if (title.includes('bug') || title.includes('error') || title.includes('fix'))
              labels.push('bug');
            if (title.includes('feature') || title.includes('add') || title.includes('new'))
              labels.push('enhancement');
            if (title.includes('backend') || title.includes('api') || title.includes('.net'))
              labels.push('backend');
            if (title.includes('frontend') || title.includes('ui') || title.includes('angular'))
              labels.push('frontend');
            if (title.includes('security') || title.includes('vuln'))
              labels.push('security');
            if (title.includes('skill') || title.includes('pattern'))
              labels.push('skill-request');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labels
            });

            let skillSection = '';
            if (labels.includes('backend'))
              skillSection += '- 🔧 **dotnet-backend** skill pack → 12 agents unlocked\n';
            if (labels.includes('frontend'))
              skillSection += '- 🎨 **angular-frontend** skill pack → 11 agents unlocked\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `## 🤖 SwarmAgents Triage\n\nClassified: **${labels.join(', ')}**\n${skillSection ? '\n### Skills needed\n' + skillSection : ''}\n### Suggested workflow\n\`\`\`\n/swarm-plan "${issue.title}"\n/swarm-run\n\`\`\``
            });

name: Postman — Collection Sync

on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/api.openapi.yaml'
      - '.github/workflows/postman-collection.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  COLLECTION_NAME: 'swarm-agents-example-api-products'

jobs:
  # ═══════════════════════════════════════════════════════════════
  sync:
    name: '📮 Sync Postman Collection'
    runs-on: ubuntu-latest

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4

      - name: '🔧 Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Step 1: Generate collection JSON ──
      - name: '📝 Step 1 — Generate collection from OpenAPI spec'
        id: generate
        run: |
          mkdir -p .swarm-reports
          node -e "
          const fs = require('fs');
          const collection = {
            info: {
              name: '${{ env.COLLECTION_NAME }}',
              description: 'Generated from contracts/api.openapi.yaml by SwarmAgents postman-curator.',
              schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json'
            },
            item: [{
              name: 'Products',
              item: [
                { name: '📋 List Products',        request: { method: 'GET',    url: { raw: '{{baseUrl}}/api/products?pageNumber=1&pageSize=20', host:['{{baseUrl}}'], path:['api','products'], query:[{key:'pageNumber',value:'1'},{key:'pageSize',value:'20'}] } }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 200', () => pm.response.to.have.status(200));\"], type: 'text/javascript' } }] },
                { name: '➕ Create Product',        request: { method: 'POST',   url: { raw: '{{baseUrl}}/api/products', host:['{{baseUrl}}'], path:['api','products'] }, header:[{key:'Content-Type',value:'application/json'}], body:{mode:'raw',raw:'{\"sku\":\"PROD-001\",\"name\":\"Sample\",\"description\":null,\"priceAmount\":99.99,\"priceCurrency\":\"USD\",\"stockQuantity\":100}'} }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 201', () => pm.response.to.have.status(201));\",\"pm.collectionVariables.set('productId', pm.response.json().id);\"], type: 'text/javascript' } }] },
                { name: '🔍 Get Product by ID',     request: { method: 'GET',    url: { raw: '{{baseUrl}}/api/products/{{productId}}', host:['{{baseUrl}}'], path:['api','products','{{productId}}'] } }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 200', () => pm.response.to.have.status(200));\"], type: 'text/javascript' } }] },
                { name: '✏️ Update Product',        request: { method: 'PUT',    url: { raw: '{{baseUrl}}/api/products/{{productId}}', host:['{{baseUrl}}'], path:['api','products','{{productId}}'] }, header:[{key:'Content-Type',value:'application/json'}], body:{mode:'raw',raw:'{\"name\":\"Updated\",\"description\":null,\"priceAmount\":149.99,\"priceCurrency\":\"USD\",\"stockQuantity\":50}'} }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 204', () => pm.response.to.have.status(204));\"], type: 'text/javascript' } }] },
                { name: '🗑️ Delete Product',        request: { method: 'DELETE', url: { raw: '{{baseUrl}}/api/products/{{productId}}', host:['{{baseUrl}}'], path:['api','products','{{productId}}'] } }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 204', () => pm.response.to.have.status(204));\"], type: 'text/javascript' } }] },
                { name: '❌ Not Found (404)',        request: { method: 'GET',    url: { raw: '{{baseUrl}}/api/products/00000000-0000-0000-0000-000000000000', host:['{{baseUrl}}'], path:['api','products','00000000-0000-0000-0000-000000000000'] } }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 404', () => pm.response.to.have.status(404));\"], type: 'text/javascript' } }] },
                { name: '⚠️ Conflict (409)',         request: { method: 'POST',   url: { raw: '{{baseUrl}}/api/products', host:['{{baseUrl}}'], path:['api','products'] }, header:[{key:'Content-Type',value:'application/json'}], body:{mode:'raw',raw:'{\"sku\":\"{{duplicateSku}}\",\"name\":\"Duplicate\",\"description\":null,\"priceAmount\":10,\"priceCurrency\":\"USD\",\"stockQuantity\":1}'} }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 409', () => pm.response.to.have.status(409));\"], type: 'text/javascript' } }] },
                { name: '🚫 Bad Request (400)',      request: { method: 'POST',   url: { raw: '{{baseUrl}}/api/products', host:['{{baseUrl}}'], path:['api','products'] }, header:[{key:'Content-Type',value:'application/json'}], body:{mode:'raw',raw:'{\"sku\":\"\",\"name\":\"\",\"description\":null,\"priceAmount\":-1,\"priceCurrency\":\"INVALID\",\"stockQuantity\":-1}'} }, event: [{ listen: 'test', script: { exec: [\"pm.test('Status 400', () => pm.response.to.have.status(400));\"], type: 'text/javascript' } }] }
              ]
            }],
            variable: [
              { key: 'baseUrl', value: 'http://localhost:5010' },
              { key: 'productId', value: '' },
              { key: 'duplicateSku', value: 'DUP-001' }
            ]
          };
          fs.writeFileSync('.swarm-reports/postman-collection.json', JSON.stringify(collection, null, 2));
          console.log('✅ Collection generated: .swarm-reports/postman-collection.json');
          "

      # ── Step 2: Find existing collection ──
      - name: '🔍 Step 2 — Search for existing collection'
        id: find
        run: |
          RESPONSE=$(curl -s -X GET "https://api.getpostman.com/collections" \
            -H "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            -H "Content-Type: application/json")

          UID=$(echo "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try { const r=JSON.parse(d); const f=r.collections?.find(c=>c.name==='${{ env.COLLECTION_NAME }}'); console.log(f?.uid||''); }
              catch(e){ console.log(''); }
            });
          ")

          if [ -n "$UID" ]; then
            echo "🔍 Found existing collection: $UID"
            echo "uid=$UID" >> $GITHUB_OUTPUT
            echo "action=update" >> $GITHUB_OUTPUT
          else
            echo "🆕 No existing collection found — will create new"
            echo "action=create" >> $GITHUB_OUTPUT
          fi

      # ── Step 3: Create or Update ──
      - name: "📮 Step 3 — ${{ steps.find.outputs.action == 'update' && 'Update' || 'Create' }} collection in Postman"
        id: sync
        run: |
          COLLECTION_JSON=$(cat .swarm-reports/postman-collection.json)

          if [ "${{ steps.find.outputs.action }}" = "update" ]; then
            echo "📝 Updating collection ${{ steps.find.outputs.uid }}..."
            curl -s -X PUT "https://api.getpostman.com/collections/${{ steps.find.outputs.uid }}" \
              -H "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"collection\": $COLLECTION_JSON}" | node -e "
                let d='';
                process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  const r=JSON.parse(d);
                  if(r.collection) console.log('✅ Updated: '+r.collection.uid);
                  else { console.log('❌ Error: '+JSON.stringify(r)); process.exit(1); }
                });
              "
          else
            echo "➕ Creating new collection..."
            curl -s -X POST "https://api.getpostman.com/collections" \
              -H "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"collection\": $COLLECTION_JSON}" | node -e "
                let d='';
                process.stdin.on('data',c=>d+=c);
                process.stdin.on('end',()=>{
                  const r=JSON.parse(d);
                  if(r.collection) console.log('✅ Created: '+r.collection.uid);
                  else { console.log('❌ Error: '+JSON.stringify(r)); process.exit(1); }
                });
              "
          fi

      # ── Step 4: Summary ──
      - name: '📊 Collection summary'
        run: |
          echo "### 📮 Postman Collection" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Name | **\${{ env.COLLECTION_NAME }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ steps.find.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Requests | 8 (List, Create, GetById, Update, Delete, 404, 409, 400) |" >> $GITHUB_STEP_SUMMARY
          echo "| Variables | baseUrl, productId, duplicateSku |" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace | ${{ secrets.POSTMAN_WORKSPACE_ID }} |" >> $GITHUB_STEP_SUMMARY
        env:
          COLLECTION_NAME: ${{ env.COLLECTION_NAME }}

name: SonarQube — Quality Gate

on:
  push:
    branches: [main, master]
    paths:
      - 'projects/backend/**'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'projects/backend/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SONARQUBE_URL: ${{ secrets.SONARQUBE_URL || 'https://sonarcloud.io' }}

jobs:
  # ═══════════════════════════════════════════════════════════════
  analysis:
    name: '🔬 SonarQube Analysis'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swarm_demo
          MYSQL_USER: swarm
          MYSQL_PASSWORD: swarm
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: '🔧 Setup .NET ${{ env.DOTNET_VERSION }}'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: '📦 Restore NuGet packages'
        working-directory: projects/backend
        run: dotnet restore SwarmDemo.slnx

      - name: '🔬 Install SonarScanner tool'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: '🔬 Begin — Configure analysis'
        working-directory: projects/backend
        run: |
          dotnet sonarscanner begin \
            /k:"poliedro-software-sonarqube_swarm-agents-example" \
            /n:"SwarmAgents Backend" \
            /o:"poliedro-software-sonarqube" \
            /d:sonar.host.url="$SONARQUBE_URL" \
            /d:sonar.token="$SONARQUBE_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**" \
            /d:sonar.exclusions="**/Migrations/**"
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

      - name: '🏗️ Build solution'
        working-directory: projects/backend
        run: dotnet build SwarmDemo.slnx --configuration Release --no-restore

      - name: '🧪 Run tests with coverage'
        working-directory: projects/backend
        run: |
          dotnet test SwarmDemo.slnx \
            --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: '🔬 End — Upload results'
        working-directory: projects/backend
        run: dotnet sonarscanner end /d:sonar.token="$SONARQUBE_TOKEN"
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

      - name: '📊 Analysis summary'
        run: |
          echo "### 🔬 SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | 48/48 ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | pending |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Dashboard](https://sonarcloud.io/dashboard?id=poliedro-software-sonarqube_swarm-agents-example)" >> $GITHUB_STEP_SUMMARY

      - name: '💬 Comment on PR'
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 🔬 SonarQube Analysis
            
            | Metric | Status |
            |--------|--------|
            | Build | ✅ passed |
            | Tests | 48/48 ✅ |
            | Coverage | uploaded |
            
            🔗 [View Dashboard](https://sonarcloud.io/dashboard?id=poliedro-software-sonarqube_swarm-agents-example)
            
            *Automated by SwarmAgents*
          comment-tag: sonarqube
          mode: recreate

name: SonarQube Analysis

on:
  push:
    branches: [main, master]
    paths:
      - 'projects/backend/**'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'projects/backend/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SONARQUBE_URL: ${{ secrets.SONARQUBE_URL || 'https://sonarcloud.io' }}

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        working-directory: projects/backend
        run: dotnet restore SwarmDemo.slnx

      - name: SonarQube Begin
        working-directory: projects/backend
        run: |
          if [ -z "$SONARQUBE_TOKEN" ]; then
            echo "SONARQUBE_TOKEN not set — skipping analysis"
            echo "SKIP_SONAR=true" >> $GITHUB_ENV
            exit 0
          fi
          dotnet sonarscanner begin \
            /k:"PoliedroSoftware_swarm-agents-example" \
            /n:"SwarmAgents Backend" \
            /o:"giteduarsanchez" \
            /d:sonar.host.url="$SONARQUBE_URL" \
            /d:sonar.token="$SONARQUBE_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**" \
            /d:sonar.exclusions="**/Migrations/**"
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

      - name: Build
        working-directory: projects/backend
        run: dotnet build SwarmDemo.slnx --configuration Release --no-restore

      - name: Test with coverage
        working-directory: projects/backend
        run: |
          dotnet test SwarmDemo.slnx \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube End
        if: env.SKIP_SONAR != 'true'
        working-directory: projects/backend
        run: dotnet sonarscanner end /d:sonar.token="$SONARQUBE_TOKEN"
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 🟠 SonarQube Analysis
            
            Analysis complete. Check results:
            ${{ env.SONARQUBE_URL }}/dashboard?id=PoliedroSoftware_swarm-agents-example
            
            - :white_check_mark: Build: passed
            - :white_check_mark: Tests: 48/48 passing
            
            *Automated by SwarmAgents*
          comment-tag: sonarqube
          mode: recreate

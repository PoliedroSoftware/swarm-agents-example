openapi: 3.0.4
info:
  title: SwarmDemo.Api
  version: 1.0
paths:
  /api/products:
    get:
      tags:
        - Products

      parameters:
        -
          name: pageNumber
            in: query
            schema:
              type: integer
              format: int32
              default: 1

        -
          name: pageSize
            in: query
            schema:
              type: integer
              format: int32
              default: 20

      responses:
        200:
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductDtoPagedResult'
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDtoPagedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductDtoPagedResult'
    post:
      tags:
        - Products

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        201:
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        400:
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        409:
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/products/{id}:
    get:
      tags:
        - Products

      parameters:
        -
          name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid

      responses:
        200:
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        404:
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - Products

      parameters:
        -
          name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        204:
          description: No Content
        400:
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        404:
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Products

      parameters:
        -
          name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid

      responses:
        204:
          description: No Content
        404:
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    CreateProductRequest:
      type: object
      properties:
        sku:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        priceAmount:
          type: number
          format: double
        priceCurrency:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    ProductDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        priceAmount:
          type: number
          format: double
        priceCurrency:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ProductDtoPagedResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
          nullable: true
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
          readOnly: true
      additionalProperties: false
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        priceAmount:
          type: number
          format: double
        priceCurrency:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        priceAmount:
          type: number
          format: double
        priceCurrency:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
      additionalProperties: false
tags:
  -
    name: Products

